# 로컬 개발용 인프라: PostgreSQL + Redis
# 집 맥북에서: docker compose up -d
# 끄기: docker compose down  (데이터 유지)  /  docker compose down -v (데이터까지 삭제)

services:
  postgres:
    image: postgres:16
    container_name: news-postgres
    environment:
      POSTGRES_DB: newsdb
      POSTGRES_USER: news
      POSTGRES_PASSWORD: newspass   # 로컬 전용. 실제 배포 땐 환경변수로.
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: news-redis
    ports:
      - "6379:6379"
    # 캐시 전용 설정: 최대 메모리 256MB, 꽉 차면 오래된 것부터 삭제(LRU)
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  redis-data:

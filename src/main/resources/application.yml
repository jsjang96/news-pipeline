spring:
  # 로컬 개발 편의: .env를 설정으로 읽어들인다(KEY=VALUE = properties 형식).
  # optional: 이라 파일이 없어도 기동 실패하지 않음 → 운영에선 진짜 환경변수를 쓰면 됨.
  config:
    import: optional:file:.env[.properties]

  application:
    name: news-pipeline

  datasource:
    url: jdbc:postgresql://localhost:5432/newsdb
    username: news
    password: ${DB_PASSWORD:newspass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 관리, JPA는 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    jdbc:
      initialize-schema: never   # 배치 메타데이터 테이블도 Flyway(V2)로 관리
    job:
      enabled: false             # 앱 시작 시 자동 실행 끄고, 스케줄러로만 실행

  data:
    redis:
      host: localhost
      port: 6379

  task:
    scheduling:
      pool:
        size: 3               # 수집/처리/전송 스케줄러가 서로 안 막히게

# 프로젝트 고유 설정
news:
  rss:
    source: GeekNews
    url: https://news.hada.io/rss/news
  collection:
    interval-ms: 600000          # 10분 (수집 배치 주기)
  processing:
    interval-ms: 600000          # 10분 (요약·분류 배치 주기)
  cache:
    summary-ttl-hours: 168       # 7일 (같은 본문 재요약 방지, Redis)

# LLM (Claude) — API 키는 환경변수로만! (코드/YAML 하드코딩 금지)
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  model: claude-haiku-4-5
  max-tokens: 300               # 출력 비용 상한

# 텔레그램 전송 — 봇 토큰/chat_id는 환경변수로만!
telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}
  chat-id: ${TELEGRAM_CHAT_ID:}
  base-url: https://api.telegram.org
  max-per-run: 10               # 한 주기에 보낼 최대 건수(백로그 폭탄 방지)
  interval-ms: 180000          # 3분 (전송 주기)

logging:
  level:
    org.springframework.batch: INFO
    com.jinsu.newspipeline: DEBUG
